name: Test the template

# Generates the template with every option on and with every option off, then on each
# OS: core tests, the desktop app build, and the app's --self-test.

on:
  # Push runs only on main: a PR branch already gets the pull_request run, and this private
  # repo pays for Actions minutes (macOS minutes cost 10x).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEMPLATE: template

jobs:
  generate-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        variant: [all-on, all-off]
    runs-on: ${{ matrix.os }}
    env:
      # The embedded Postgres download lists GitHub releases; unauthenticated calls get rate-limited.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - name: Postgres + pgvector for Linux (runner CPUs may lack the AVX-512 the prebuilt pgvector needs)
        if: runner.os == 'Linux' && matrix.variant == 'all-on'
        run: |
          docker run -d --name pg -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app -e POSTGRES_DB=app -p 5433:5432 pgvector/pgvector:pg17
          for i in $(seq 30); do docker exec pg pg_isready -U app && break; sleep 2; done
          echo "APP_PG_URL=postgres://app:app@localhost:5433/app" >> "$GITHUB_ENV"
      - name: Generate
        run: |
          common=(-d "app_name=Test App" -d identifier=com.example.testapp -d "description=Template test" -d github_repo=example/test-app)
          if [ "${{ matrix.variant }}" = all-on ]; then
            opts=(-d embeddings=true -d embedding_model=bge-small-en-v1.5 -d postgres=true -d bm25=true -d watch_folders=true -d ai=true -d pdf=true -d wizard=true -d updater=true
                  -d installers=true -d macos_pkg=true -d install_scripts=true -d linux=true -d claude_mcp=true -d mcp_server_name=demo
                  -d mcp_package=demo-server -d frontend=react -d ipc_worker=true -d background_agent=true -d python_example=true)
          else
            opts=(-d embeddings=false -d postgres=false -d watch_folders=false -d ai=false -d pdf=false -d wizard=false -d updater=false -d installers=false
                  -d claude_mcp=false -d frontend=vanilla -d ipc_worker=false -d python_example=false)
          fi
          cargo generate --path "$TEMPLATE" --name test-app --destination "$RUNNER_TEMP" --silent --vcs none "${common[@]}" "${opts[@]}"
          echo "APP=$RUNNER_TEMP/test-app" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP }}
          key: ${{ matrix.variant }}
      - name: React UI
        if: matrix.variant == 'all-on'
        working-directory: ${{ env.APP }}
        run: npm --prefix ui-react ci --include=dev && npm --prefix ui-react run build
      - name: Python worker
        if: matrix.variant == 'all-on'
        working-directory: ${{ env.APP }}
        run: python python/test_worker.py
      - name: Test, build, self-test
        working-directory: ${{ env.APP }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export RUSTFLAGS="-C link-arg=$(xcrun clang --print-runtime-dir)/libclang_rt.osx.a"; fi
          cargo fmt --all --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          # The first run downloads the embedding model from Hugging Face, which sometimes fails
          # mid-download; retry so a network blip doesn't fail the build.
          for i in 1 2 3; do cargo run -p test-app -- --self-test && exit 0; echo "self-test attempt $i failed"; sleep 15; done
          exit 1
