[package]
name = "desktop-kitchen"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "The Kitchen CLI: create cross-platform desktop apps, turn features on and off, generate code, and serve it all over MCP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adeelahmad/tauri-desktop-template"
readme = "README.md"
keywords = ["tauri", "desktop", "template", "generator", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "kitchen"
path = "src/lib.rs"

[[bin]]
name = "kitchen"
path = "src/main.rs"

# Its own workspace, so the template folder next to it (Liquid, not Rust) is never read.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# `kitchen i18n check`: the Fluent parser the app itself uses.
fluent-syntax = "0.12"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
