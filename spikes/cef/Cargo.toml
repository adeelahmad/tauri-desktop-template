# Standalone spike: the Kitchen web wrapper's hooks on Chromium (CEF) through Tauri 3 alpha.
# Not part of the template workspace and not generated by cargo-generate.
[package]
name = "kitchen-cef-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Kitchen web wrapper hooks on tauri-runtime-cef (spike)"
license = "MIT OR Apache-2.0"

# Its own workspace, so the template's manifests (Liquid templates) are never read.
[workspace]

[[bin]]
name = "kitchen-cef-spike"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", default-features = false }

[dependencies]
# Exact pins: the alphas break APIs between releases, and tauri-runtime-cef pins cef =154.5.0.
tauri = { version = "=3.0.0-alpha.6", default-features = false, features = ["compression"] }
tauri-runtime-cef = "=3.0.0-alpha.7"
log = "0.4"
# What desktop-core's wrapper::{url, pin, proxy} need (the same versions desktop-core uses).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
sha2 = "0.10"
ring = "0.17"

# No debug info in dev builds: the spike's dependency tree is large and the disk is not.
[profile.dev]
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
