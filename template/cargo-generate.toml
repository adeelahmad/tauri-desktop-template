[template]
cargo_generate_version = ">=0.22.0"
# Copied as they are (GitHub Actions uses ${{ }} too, and icons are binary).
exclude = [".github/workflows/ci.yml", ".github/workflows/release.yml", ".github/workflows/pr-title.yml", ".github/workflows/pg-extensions.yml", ".github/workflows/mobile.yml", "src-tauri/icons/*"]

[placeholders.app_name]
type = "string"
prompt = "App name shown to users (window title, installer)"
default = "My App"

[placeholders.identifier]
type = "string"
prompt = "Bundle identifier (reverse domain)"
default = "com.example.myapp"
regex = "^[a-zA-Z][a-zA-Z0-9-]*(\\.[a-zA-Z0-9-]+)+$"

[placeholders.description]
type = "string"
prompt = "One-line description"
default = "A cross-platform desktop app"

[placeholders.github_repo]
type = "string"
prompt = "GitHub repository (owner/name), used by releases, the updater and the install scripts"
default = "owner/my-app"
regex = "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"

[placeholders.embeddings]
type = "bool"
prompt = "Local ONNX text embeddings (fastembed-rs, no API calls)?"
default = true

[placeholders.postgres]
type = "bool"
prompt = "Embedded Postgres + pgvector store (downloads itself on first run)?"
default = true

[placeholders.watch_folders]
type = "bool"
prompt = "Drop folder + watch folders that ingest new files automatically?"
default = false

[placeholders.ai]
type = "bool"
prompt = "AI chat over your documents (Claude, OpenAI, Gemini, Ollama or any OpenAI-compatible server; off until switched on in Settings)?"
default = false

[conditional.'ai'.placeholders.local_llm]
type = "bool"
prompt = "Built-in llama.cpp (statically linked) so GGUF models run inside the app with no server? Adds a few minutes to the first build"
default = false

[placeholders.tts]
type = "bool"
prompt = "Text to speech with tiny-voca (4.5M params, Apache-2.0, two English voices; ONNX Runtime, model downloads on first use)?"
default = false

[placeholders.email]
type = "bool"
prompt = "Send email over SMTP (native Rust: SSL/TLS on 465, STARTTLS on 587, login, attachments)?"
default = false

[placeholders.background_jobs]
type = "bool"
prompt = "Background jobs: a persistent queue with retries (exponential backoff), dead letters, cron and interval schedules, cancel and timeouts?"
default = false

[placeholders.plugins]
type = "bool"
prompt = "Plugin API: compiled-in app extensions (ingest hooks, extra search sources, their own methods and settings), with an example plugin?"
default = false

[placeholders.rclone]
type = "bool"
prompt = "Cloud sync of backups (or the data folder) to any cloud with rclone (pinned, checksummed, downloads on first use)?"
default = false

[placeholders.tailscale]
type = "bool"
prompt = "Tailscale: show status and share a local MCP/HTTP port with your tailnet through `tailscale serve` (uses the user's own Tailscale)?"
default = false

[placeholders.tauri_plugins]
type = "bool"
prompt = "Add official Tauri plugins (dialog, fs, clipboard, notification, opener, store, global shortcut, autostart, deep link, window state, os, process, log)? Asks for each"
default = false

[placeholders.stt]
type = "bool"
prompt = "Speech to text with Whisper (tiny/base/small, multilingual, MIT; ONNX Runtime, model downloads on first use): dictate questions or transcribe audio files?"
default = false

[placeholders.telemetry]
type = "bool"
prompt = "Opt-in telemetry: crash reports (Sentry), anonymous analytics (PostHog or Aptabase), traces (OpenTelemetry)? Nothing is sent until the user switches it on"
default = false

[placeholders.mobile]
type = "bool"
prompt = "Also build for iOS and Android (Tauri 2 mobile: file store, in-process backend, store updates; desktop-only parts compiled out)?"
default = false

[placeholders.single_instance]
type = "bool"
prompt = "Single instance: a second launch brings the running window to the front (recommended with embedded Postgres)?"
default = false

[placeholders.mcp_server]
type = "bool"
prompt = "Built-in MCP server (Rust, stdio) so Claude Desktop, Claude Code and other MCP clients can search this app's documents? Off until switched on in Settings"
default = false

[placeholders.pdf]
type = "bool"
prompt = "PDF text extraction (docling.rs, tesseract OCR fallback)?"
default = true

[placeholders.wizard]
type = "bool"
prompt = "First-run setup wizard?"
default = true

[placeholders.frontend]
type = "string"
prompt = "Frontend"
choices = ["vanilla", "react"]
default = "react"

[placeholders.ipc_worker]
type = "bool"
prompt = "Run the backend as a separate worker process over local IPC (socket / named pipe)?"
default = true

[placeholders.python_example]
type = "bool"
prompt = "Python worker example (child process over stdio JSON)?"
default = true

[placeholders.updater]
type = "bool"
prompt = "Auto-update from GitHub releases (Tauri updater)?"
default = true

[placeholders.installers]
type = "bool"
prompt = "Release workflow that builds and tests installers (macOS .dmg, Windows .exe)?"
default = true

[placeholders.claude_mcp]
type = "bool"
prompt = "Bundle uv and register a Python MCP server in Claude Desktop?"
default = false

[conditional.'embeddings'.placeholders.embedding_model]
type = "string"
prompt = "Embedding model"
choices = ["nomic-embed-text-v1.5", "bge-small-en-v1.5", "all-MiniLM-L6-v2", "multilingual-e5-small"]
default = "nomic-embed-text-v1.5"

[conditional.'postgres'.placeholders.bm25]
type = "bool"
prompt = "BM25 keyword ranking in Postgres (VectorChord-BM25) for hybrid BM25 + vector search?"
default = false

[conditional.'installers'.placeholders.macos_pkg]
type = "bool"
prompt = "Also build a macOS .pkg that clears the quarantine flag (unsigned app opens without prompts)?"
default = true

[conditional.'installers'.placeholders.install_scripts]
type = "bool"
prompt = "One-line install scripts (curl | sh for macOS, PowerShell for Windows)?"
default = true

[conditional.'installers'.placeholders.linux]
type = "bool"
prompt = "Also build Linux installers (.AppImage, .deb)?"
default = false

[conditional.'ipc_worker'.placeholders.background_agent]
type = "bool"
prompt = "Background agent that starts the worker at login (macOS LaunchAgent, Windows Run entry, Linux systemd)?"
default = true

[conditional.'claude_mcp'.placeholders.mcp_server_name]
type = "string"
prompt = "MCP server name in Claude Desktop's config"
default = "my-mcp"

[conditional.'claude_mcp'.placeholders.mcp_package]
type = "string"
prompt = "Python package uv runs (a PyPI name, or 'name @ https://.../archive.zip')"
default = "my-mcp-server"

[conditional.'tauri_plugins'.placeholders.tauri_dialog]
type = "bool"
prompt = "Tauri plugin Dialog: native open/save file pickers and message boxes?"
default = false

[conditional.'tauri_plugins'.placeholders.tauri_fs]
type = "bool"
prompt = "Tauri plugin File system: read and write files from the frontend, scoped by capabilities?"
default = false

[conditional.'tauri_plugins'.placeholders.tauri_clipboard]
type = "bool"
prompt = "Tauri plugin Clipboard manager: read and write the clipboard?"
default = false

[conditional.'tauri_plugins'.placeholders.tauri_notification]
type = "bool"
prompt = "Tauri plugin Notifications: native system notifications?"
default = false

[conditional.'tauri_plugins'.placeholders.tauri_opener]
type = "bool"
prompt = "Tauri plugin Opener: open URLs and files with the default app, reveal in the file manager?"
default = false

[conditional.'tauri_plugins'.placeholders.tauri_store]
type = "bool"
prompt = "Tauri plugin Store: a persistent key-value store for the frontend?"
default = false

[conditional.'tauri_plugins'.placeholders.tauri_global_shortcut]
type = "bool"
prompt = "Tauri plugin Global shortcut: keyboard shortcuts that work while the app is in the background (desktop)?"
default = false

[conditional.'tauri_plugins'.placeholders.tauri_autostart]
type = "bool"
prompt = "Tauri plugin Autostart: launch the app at login (desktop)?"
default = false

[conditional.'tauri_plugins'.placeholders.tauri_deep_link]
type = "bool"
prompt = "Tauri plugin Deep link: open the app from <app-name>:// links?"
default = false

[conditional.'tauri_plugins'.placeholders.tauri_window_state]
type = "bool"
prompt = "Tauri plugin Window state: remember window size and position (desktop)?"
default = false

[conditional.'tauri_plugins'.placeholders.tauri_os]
type = "bool"
prompt = "Tauri plugin OS: platform, version, architecture and locale for the frontend?"
default = false

[conditional.'tauri_plugins'.placeholders.tauri_process]
type = "bool"
prompt = "Tauri plugin Process: exit or restart the app from the frontend?"
default = false

[conditional.'tauri_plugins'.placeholders.tauri_log]
type = "bool"
prompt = "Tauri plugin Log: frontend logs written to the app's own log files?"
default = false

[conditional.'!embeddings']
ignore = ["desktop-core/src/embed.rs"]

[conditional.'!postgres']
ignore = ["desktop-core/src/pgstore.rs", "desktop-core/pg-ext.sha256", ".github/workflows/pg-extensions.yml", "scripts/pg-ext"]

[conditional.'!mcp_server']
ignore = ["desktop-core/src/mcp.rs", "src-tauri/src/mcp.rs"]

[conditional.'!ai']
ignore = ["desktop-core/src/llm.rs", "desktop-core/src/local.rs", "desktop-core/src/cache.rs"]

[conditional.'ai && !local_llm']
ignore = ["desktop-core/src/local.rs"]

[conditional.'!tts']
ignore = ["desktop-core/src/tts.rs"]

[conditional.'!email']
ignore = ["desktop-core/src/mail.rs"]

[conditional.'!stt']
ignore = ["desktop-core/src/stt.rs", "src-tauri/Info.plist", "src-tauri/Entitlements.plist"]

[conditional.'!background_jobs']
ignore = ["desktop-core/src/queue.rs", "desktop-core/src/job_types"]

[conditional.'!plugins']
ignore = ["desktop-core/src/plugin.rs"]

[conditional.'!rclone']
ignore = ["desktop-core/src/rclone.rs"]

[conditional.'!tailscale']
ignore = ["desktop-core/src/tailscale.rs"]

[conditional.'!tauri_plugins || !(tauri_global_shortcut || tauri_autostart || tauri_window_state || tauri_process)']
ignore = ["src-tauri/capabilities/desktop.json"]

[conditional.'!telemetry']
ignore = ["desktop-core/src/telemetry.rs"]

[conditional.'!mobile']
ignore = [".github/workflows/mobile.yml", "src-tauri/capabilities/mobile.json", "src-tauri/tauri.android.conf.json", "src-tauri/tauri.ios.conf.json"]

[conditional.'!single_instance']
ignore = ["src-tauri/src/single.rs"]

[conditional.'!watch_folders']
ignore = ["desktop-core/src/watch.rs"]

[conditional.'!pdf']
ignore = ["desktop-core/src/pdf.rs"]

[conditional.'frontend == "react"']
ignore = ["ui"]

[conditional.'frontend != "react"']
ignore = ["ui-react"]

[conditional.'!ipc_worker']
ignore = ["src-tauri/src/ipc.rs", "src-tauri/src/agent.rs"]

[conditional.'ipc_worker && !background_agent']
ignore = ["src-tauri/src/agent.rs"]

[conditional.'!python_example']
ignore = ["python", "src-tauri/src/python.rs"]

[conditional.'!updater']
ignore = ["src-tauri/src/update.rs"]

[conditional.'!claude_mcp']
ignore = ["src-tauri/src/claude.rs", "src-tauri/tauri.release.conf.json"]

[conditional.'!installers']
ignore = [".github/workflows/release.yml", ".github/release.json", "macos-pkg", "scripts", "docs/install-unsigned.md"]

[conditional.'installers && !macos_pkg']
ignore = ["macos-pkg"]

[conditional.'installers && !install_scripts']
ignore = ["scripts"]
