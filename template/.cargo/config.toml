[env]
{% if embeddings -%}
# Default embedding model (APP_EMBED_MODEL at run time overrides it). Changing it re-embeds
# the stored chunks on next start.
APP_EMBED_MODEL = "{{embedding_model}}"
{% endif -%}
{% if claude_mcp -%}
APP_MCP_NAME = "{{mcp_server_name}}"
APP_MCP_PACKAGE = "{{mcp_package}}"
{% endif -%}
{% if postgres -%}
# Postgres extension bundle (pgvector, pg_tokenizer, VectorChord-BM25) for embedded
# Postgres 16.16.0, one zip per target. Run the "Postgres extensions" workflow once with
# publish on (Actions tab) to attach it to this repo's pg-ext-16.16.0-r1 release, then pin the
# release's SHA256SUMS in desktop-core/pg-ext.sha256. The release must be downloadable
# without a login (a public repo, or point this at any public host).
APP_PG_EXT_URL = "https://github.com/{{github_repo}}/releases/download/pg-ext-16.16.0-r1/pg16-extensions-{target}.zip"
{% endif -%}
APP_REPOSITORY = "{{github_repo}}"
APP_IDENTIFIER = "{{identifier}}"
