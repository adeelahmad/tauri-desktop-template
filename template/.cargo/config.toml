[env]
{% if embeddings -%}
# Default embedding model (APP_EMBED_MODEL at run time overrides it). Changing it re-embeds
# the stored chunks on next start.
APP_EMBED_MODEL = "{{embedding_model}}"
{% endif -%}
{% if claude_mcp -%}
APP_MCP_NAME = "{{mcp_server_name}}"
APP_MCP_PACKAGE = "{{mcp_package}}"
{% endif -%}
{% if postgres -%}
# Postgres extension bundle (pgvector, pg_tokenizer, VectorChord-BM25) for embedded
# Postgres 16.16.0, one zip per target, from the public adeelahmad/pg-extensions release
# (hashes pinned in desktop-core/pg-ext.sha256). To build your own, run the bundled
# "Postgres extensions" workflow with publish on, point this at your public release and
# replace the pinned hashes with its SHA256SUMS.
APP_PG_EXT_URL = "https://github.com/adeelahmad/pg-extensions/releases/download/pg-ext-16.16.0-r1/pg16-extensions-{target}.zip"
{% endif -%}
{% if bundle_embedding_model or bundle_stt_model or bundle_tts_voice or bundle_llm -%}
# Models built into the installer (desktop_core::models; docs/GUIDE.md "Bundling models"):
# bundle or bundle_with_fallback. APP_MODELS at run time overrides it.
APP_MODELS = "{{models}}"
{% endif -%}
APP_REPOSITORY = "{{github_repo}}"
APP_IDENTIFIER = "{{identifier}}"
