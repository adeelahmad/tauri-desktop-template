name: Mobile

# Builds the Android and iOS apps from the same code as the desktop app, unsigned, and keeps
# them as workflow artifacts. Runs by hand and on version tags.
#
# The native projects (src-tauri/gen/android, src-tauri/gen/apple) are made fresh with
# `tauri android init` / `tauri ios init` on each run. Once you commit your own (to change
# icons, permissions or signing), delete the init steps.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Tauri CLI
        run: cargo install tauri-cli --version "=3.0.0-alpha.6" --locked
      - name: Android project
        run: cargo tauri android init --ci
      # Signing for Google Play: add the repository secrets ANDROID_KEY_BASE64 (your upload
      # keystore, base64), ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, write them here into
      # src-tauri/gen/android/keystore.properties (storeFile, keyAlias, password) and add the
      # matching signingConfigs block to src-tauri/gen/android/app/build.gradle.kts, as in
      # https://v2.tauri.app/distribute/sign/android/ . Without them the build is unsigned.
      - name: Build APK and AAB (unsigned)
        run: cargo tauri android build --ci --apk --aab --target aarch64 --target armv7
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Tauri CLI
        run: cargo install tauri-cli --version "=3.0.0-alpha.6" --locked
      - name: iOS project
        run: cargo tauri ios init --ci
      # Signing for the App Store: add the repository secrets IOS_CERTIFICATE (a .p12,
      # base64), IOS_CERTIFICATE_PASSWORD, IOS_MOBILE_PROVISION (base64) and
      # APPLE_DEVELOPMENT_TEAM, pass them as env to a `cargo tauri ios build --export-method
      # app-store-connect` step, and upload the .ipa with APPLE_API_KEY / APPLE_API_ISSUER
      # (an App Store Connect API key), as in https://v2.tauri.app/distribute/sign/ios/ .
      # Without them only the simulator build below runs: it needs no signing.
      - name: Build for the iOS simulator (unsigned)
        run: cargo tauri ios build --ci --debug --target aarch64-sim
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: src-tauri/gen/apple/build/**/*.app
