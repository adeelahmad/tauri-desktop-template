name: Rollout

# Change how many installs a release on an update channel reaches (feature
# `release_channels`). Each install has a stable random bucket from 0 to 99 and takes the
# update when its bucket is below the percentage, so raising 10 -> 50 -> 100 widens the
# same group, and 0 pauses the rollout (installs that already updated keep the version).
#
# The release workflow publishes each channel's `latest.json` on a release tagged
# `channel-stable` / `channel-beta`; this edits the `rollout` field there.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        options: [stable, beta]
        default: stable
      percent:
        description: Share of installs that get the update (0 to 100)
        type: number
        required: true
        default: 100

permissions:
  contents: write

concurrency:
  group: rollout-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANNEL: ${{ inputs.channel }}
      PERCENT: ${{ inputs.percent }}
    steps:
      - name: Set the rollout
        run: |
          case "$PERCENT" in ''|*[!0-9.]*) echo "percent must be a number"; exit 1 ;; esac
          tag="channel-$CHANNEL"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir manifest
          jq --argjson p "$PERCENT" '.rollout = ([[$p, 0] | max, 100] | min)' manifest/latest.json > latest.json
          cat latest.json
          gh release upload "$tag" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          echo "Channel $CHANNEL: version $(jq -r .version latest.json) now reaches $(jq -r .rollout latest.json)% of installs." >> "$GITHUB_STEP_SUMMARY"
