name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ESLint and Prettier
        if: hashFiles('ui-react/package.json') != ''
        run: npm --prefix ui-react ci --include=dev && npm --prefix ui-react run lint
      - name: pre-commit hooks (whitespace, TOML/YAML/JSON, rustfmt, clippy, ruff, shellcheck, actionlint, typos)
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: conventional-pre-commit

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Python worker tests
        if: hashFiles('python/worker.py') != ''
        run: python3 python/test_worker.py
      - name: Tests (no optional parts, nothing to download)
        run: cargo test -p desktop-core
      - name: Every optional part compiles
        run: cargo clippy -p desktop-core --all-features -- -D warnings

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - name: Build the React UI (the app embeds it)
        if: hashFiles('ui-react/package.json') != ''
        shell: bash
        run: npm --prefix ui-react ci --include=dev && npm --prefix ui-react run build
      - name: Build the app (default features) and run its tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export RUSTFLAGS="-C link-arg=$(xcrun clang --print-runtime-dir)/libclang_rt.osx.a"; fi
          pkg=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print([p['name'] for p in json.load(sys.stdin)['packages'] if p['name']!='desktop-core'][0])")
          cargo test -p "$pkg"
          cargo build -p "$pkg"
          cargo run -p "$pkg" -- --self-test
