# cargo-deny policy: licences, security advisories, banned crates and where crates may
# come from. `make audit` (or `kitchen audit`) runs `cargo deny check`; so does CI when the
# app was generated with `supply_chain`. Docs: https://embarkstudios.github.io/cargo-deny/
#
# Check one part: `cargo deny check licenses` (or advisories, bans, sources).
# See every licence in the tree: `cargo deny list`.

[graph]
# The platforms the app ships on; crates only other platforms use are not checked.
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Check every optional part, so turning a feature on later cannot bring in a surprise.
all-features = true

[advisories]
# RustSec advisory database (https://rustsec.org). Vulnerabilities always fail the check;
# yanked crates do too.
yanked = "deny"
# Advisories you have looked at and accepted, each with the reason, e.g.
# { id = "RUSTSEC-2024-0000", reason = "only reachable from the build script" },
ignore = []

[licenses]
# Permissive licences, plus MPL-2.0 (file-level copyleft: fine to link, changes to those
# files stay open). Add one only after reading it; `cargo deny list` shows who uses what.
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # Embedded Postgres (feature `postgres`): the PostgreSQL licence, BSD-like.
    "PostgreSQL",
]
# The list covers every optional part; one build uses only some of them.
unused-allowed-license = "allow"
# How sure cargo-deny must be when it reads a licence text without an SPDX id.
confidence-threshold = 0.9

# This workspace's own crates are not published, so their licence is yours to choose.
[licenses.private]
ignore = true

[bans]
# Two versions of one crate are common in a Tauri tree (and harmless): warn, don't fail.
multiple-versions = "warn"
# `version = "*"` would take whatever is newest, including a compromised release.
wildcards = "deny"
allow-wildcard-paths = true
# Crates this app must never link, with the reason. For example, OpenSSL (the app's own
# code uses rustls; note that embedded Postgres still pulls in native-tls):
# { crate = "openssl-sys", reason = "needs system libraries on every OS" },
deny = []

[sources]
# Only crates.io; a git dependency must be listed here first.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
