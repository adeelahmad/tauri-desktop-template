<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{app_name}} Settings</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header><h1 data-i18n="settings-title">Settings</h1></header>

  <section>
    <h2 data-i18n="section-appearance">Appearance</h2>
    <div class="row">
      <label><span data-i18n="setting-appearance-mode">Light or dark</span>
        <select id="mode">
          <option value="system" data-i18n="setting-appearance-mode-system">Follow the system</option>
          <option value="light" data-i18n="setting-appearance-mode-light">Light</option>
          <option value="dark" data-i18n="setting-appearance-mode-dark">Dark</option>
        </select>
      </label>
      <label><span data-i18n="setting-appearance-theme">Theme</span>
        <select id="theme">
          <option value="kitchen" data-i18n="setting-appearance-theme-kitchen">Kitchen</option>
          <option value="nord" data-i18n="setting-appearance-theme-nord">Nord</option>
          <option value="solarized" data-i18n="setting-appearance-theme-solarized">Solarized</option>
          <option value="forest" data-i18n="setting-appearance-theme-forest">Forest</option>
          <option value="rose" data-i18n="setting-appearance-theme-rose">Rosé</option>
          <option value="contrast" data-i18n="setting-appearance-theme-contrast">High contrast</option>
        </select>
      </label>
      <label><span data-i18n="setting-appearance-font-size">Text size (px)</span> <input id="font-size" type="number" min="10" max="24"></label>
    </div>
    <div class="row">
      <label><span data-i18n="appearance-ui-font">Interface font</span> <input id="ui-font" list="ui-fonts" placeholder="system"></label>
      <label><span data-i18n="appearance-mono-font">Code and editor font</span> <input id="mono-font" list="mono-fonts" placeholder="system"></label>
    </div>
    <datalist id="ui-fonts"><option value="humanist"><option value="rounded"><option value="serif"></datalist>
    <datalist id="mono-fonts"><option value="cascadia"><option value="jetbrains"><option value="fira"></datalist>
    <p class="hint" data-i18n="appearance-font-hint">Empty uses the system font. A preset, or the name of any installed or bundled font (see shell.css).</p>
  </section>

  <section>
    <h2 data-i18n="settings-everything-else">Everything else</h2>
    <p class="hint" data-i18n="settings-json-hint-all">Search, ingest and the other settings as JSON (missing keys use the defaults; everything optional is off).</p>
    <textarea id="config" rows="16" spellcheck="false"></textarea>
  </section>

  <div class="row">
    <button id="save" data-i18n="settings-save">Save settings</button>
    <button id="reset" class="link" data-i18n="settings-reset">Reset to defaults</button>
  </div>
  <p id="status" class="status"></p>

  <script src="errors.js"></script>{% if i18n %}
  <script src="i18n.js"></script>{% endif %}
  <script src="settings.js"></script>
  <script src="shell.js"></script>
</body>
</html>
