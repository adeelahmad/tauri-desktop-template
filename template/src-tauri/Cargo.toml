[package]
name = "{{project-name}}"
description = "{{description}}"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# What you chose when generating; `cargo build --no-default-features --features ...` picks others.
default = [{% if embeddings %}"embed", {% endif %}{% if postgres %}"postgres", {% if bm25 %}"bm25", {% endif %}{% endif %}{% if pdf %}"pdf", {% endif %}{% if watch_folders %}"watch", {% endif %}{% if ai %}"ai", {% if local_llm %}"llama", {% endif %}{% endif %}{% if mcp_server %}"mcp", {% endif %}{% if tts %}"tts", {% endif %}{% if stt %}"stt", {% endif %}{% if email %}"mail", {% endif %}{% if telemetry %}"telemetry", {% endif %}{% if single_instance %}"single-instance", {% endif %}{% if wizard %}"wizard", {% endif %}{% if updater %}"updater", {% endif %}{% if ipc_worker %}"ipc-worker", {% if background_agent %}"background-agent", {% endif %}{% endif %}{% if python_example %}"python-example", {% endif %}{% if claude_mcp %}"claude-mcp", {% endif %}]
{% if embeddings -%}
embed = ["desktop-core/embed"]
{% endif -%}
{% if postgres -%}
postgres = ["desktop-core/postgres"]
{% if bm25 -%}
bm25 = ["desktop-core/bm25"]
{% endif -%}
{% endif -%}
{% if watch_folders -%}
watch = ["desktop-core/watch"]
{% endif -%}
{% if ai -%}
ai = ["desktop-core/ai"]
{% if local_llm -%}
llama = ["ai", "desktop-core/llama"]
{% endif -%}
{% endif -%}
{% if tts -%}
tts = ["desktop-core/tts"]
{% endif -%}
{% if stt -%}
stt = ["desktop-core/stt"]
{% endif -%}
{% if email -%}
mail = ["desktop-core/mail"]
{% endif -%}
{% if telemetry -%}
telemetry = ["desktop-core/telemetry"]
{% endif -%}
{% if single_instance -%}
# A second launch focuses the running window and exits (std only: a file lock and a loopback knock).
single-instance = []
{% endif -%}
{% if mcp_server -%}
mcp = ["desktop-core/mcp"]
{% endif -%}
{% if pdf -%}
pdf = ["desktop-core/pdf"]
{% endif -%}
# First-run wizard: choose the store and fetch the model before the main screen.
wizard = []
{% if updater -%}
# Checks GitHub releases for a signed update and installs it in place.
updater = ["dep:tauri-plugin-updater"]
{% endif -%}
{% if ipc_worker -%}
# Backend in its own process (`<app> --worker`), reached over a local socket / named pipe.
ipc-worker = ["dep:interprocess"]
{% if background_agent -%}
# Start the worker at login: launchd LaunchAgent, Windows Run entry, systemd user unit.
background-agent = ["ipc-worker"]
{% endif -%}
{% endif -%}
{% if python_example -%}
# A long-lived Python child process over stdio JSON (python/worker.py).
python-example = []
{% endif -%}
{% if claude_mcp -%}
# Copies the bundled uv and registers a Python MCP server in Claude Desktop.
claude-mcp = []
{% endif %}
[dependencies]
desktop-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
log = "0.4"
{% if ipc_worker -%}
interprocess = { version = "2", optional = true }
{% endif -%}
{% if updater -%}
tauri-plugin-updater = { version = "2", optional = true }
{% endif -%}
