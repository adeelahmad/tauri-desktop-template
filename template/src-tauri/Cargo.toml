[package]
name = "{{project-name}}"
description = "{{description}}"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs merges config/*.json (the layered app config).
serde_json.workspace = true

[features]
# What you chose when generating; `cargo build --no-default-features --features ...` picks others.
default = [{% if embeddings %}"embed", {% endif %}{% if postgres %}"postgres", {% if bm25 %}"bm25", {% endif %}{% endif %}{% if pdf %}"pdf", {% endif %}{% if watch_folders %}"watch", {% endif %}{% if ai %}"ai", {% if local_llm %}"llama", {% endif %}{% endif %}{% if mcp_server %}"mcp", {% endif %}{% if tts %}"tts", {% endif %}{% if stt %}"stt", {% endif %}{% if email %}"mail", {% endif %}{% if plugins %}"plugins", {% endif %}{% if background_jobs %}"jobs-queue", {% endif %}{% if rclone %}"rclone", {% endif %}{% if tailscale %}"tailscale", {% endif %}{% if http_api %}"http-api", {% endif %}{% if webview %}"webview", {% endif %}{% if telemetry %}"telemetry", {% endif %}{% if single_instance %}"single-instance", {% endif %}{% if wizard %}"wizard", {% endif %}{% if updater %}"updater", {% endif %}{% if ipc_worker %}"ipc-worker", {% if background_agent %}"background-agent", {% endif %}{% endif %}{% if python_example %}"python-example", {% endif %}{% if claude_mcp %}"claude-mcp", {% endif %}{% if tray_menu %}"tray-menu", {% endif %}]
{% if embeddings -%}
embed = ["desktop-core/embed"]
{% endif -%}
{% if postgres -%}
postgres = ["desktop-core/postgres"]
{% if bm25 -%}
bm25 = ["desktop-core/bm25"]
{% endif -%}
{% endif -%}
{% if watch_folders -%}
watch = ["desktop-core/watch"]
{% endif -%}
{% if ai -%}
ai = ["desktop-core/ai"]
{% if local_llm -%}
llama = ["ai", "desktop-core/llama"]
{% endif -%}
{% endif -%}
{% if tts -%}
tts = ["desktop-core/tts"]
{% endif -%}
{% if stt -%}
stt = ["desktop-core/stt"]
{% endif -%}
{% if email -%}
mail = ["desktop-core/mail"]
{% endif -%}
{% if telemetry -%}
telemetry = ["desktop-core/telemetry"]
{% endif -%}
{% if background_jobs -%}
jobs-queue = ["desktop-core/jobs-queue"]
{% endif -%}
{% if plugins -%}
plugins = ["desktop-core/plugins"]
{% endif -%}
{% if rclone -%}
rclone = ["desktop-core/rclone"]
{% endif -%}
{% if tailscale -%}
tailscale = ["desktop-core/tailscale"]
{% endif -%}
{% if http_api -%}
# The local REST API (desktop only): desktop_core::http_api, served from this process.
http-api = ["desktop-core/http-api"]
{% endif -%}
{% if webview -%}
# Remote pages in the app's own windows, behind an allowlist, with no IPC (desktop only).
webview = ["desktop-core/webview"]
{% endif -%}
{% if single_instance -%}
# A second launch focuses the running window and exits (std only: a file lock and a loopback knock).
single-instance = []
{% endif -%}
{% if mcp_server -%}
mcp = ["desktop-core/mcp"]
{% endif -%}
{% if pdf -%}
pdf = ["desktop-core/pdf"]
{% endif -%}
# First-run wizard: choose the store and fetch the model before the main screen.
wizard = []
{% if updater -%}
# Checks GitHub releases for a signed update and installs it in place.
updater = ["dep:tauri-plugin-updater"]
{% endif -%}
{% if ipc_worker -%}
# Backend in its own process (`<app> --worker`), reached over a local socket / named pipe.
ipc-worker = ["dep:interprocess"]
{% if background_agent -%}
# Start the worker at login: launchd LaunchAgent, Windows Run entry, systemd user unit.
background-agent = ["ipc-worker"]
{% endif -%}
{% endif -%}
{% if python_example -%}
# A long-lived Python child process over stdio JSON (python/worker.py).
python-example = []
{% endif -%}
{% if claude_mcp -%}
# Copies the bundled uv and registers a Python MCP server in Claude Desktop.
claude-mcp = []
{% endif -%}
{% assign shortcut_plugin = false -%}
{% if tauri_plugins -%}{% if tauri_global_shortcut -%}{% assign shortcut_plugin = true -%}{% endif -%}{% endif -%}
{% if tray_menu -%}
# Tray / menu-bar icon, global shortcuts and the app menu, from Settings (desktop only).
tray-menu = ["tauri/tray-icon", "desktop-core/tray-menu"{% unless shortcut_plugin %}, "dep:tauri-plugin-global-shortcut"{% endunless %}]
{% endif %}
[dependencies]
desktop-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
log = "0.4"
{% if tauri_plugins -%}
# Official Tauri plugins chosen when the app was generated (each is wired in lib.rs and capabilities/).
{% if tauri_dialog -%}
tauri-plugin-dialog = "2"
{% endif -%}
{% if tauri_fs -%}
tauri-plugin-fs = "2"
{% endif -%}
{% if tauri_clipboard -%}
tauri-plugin-clipboard-manager = "2"
{% endif -%}
{% if tauri_notification -%}
tauri-plugin-notification = "2"
{% endif -%}
{% if tauri_opener -%}
tauri-plugin-opener = "2"
{% endif -%}
{% if tauri_store -%}
tauri-plugin-store = "2"
{% endif -%}
{% if tauri_deep_link -%}
tauri-plugin-deep-link = "2"
{% endif -%}
{% if tauri_os -%}
tauri-plugin-os = "2"
{% endif -%}
{% if tauri_log -%}
tauri-plugin-log = "2"
{% endif -%}
{% endif -%}
{% if ipc_worker or updater or tray_menu or tauri_global_shortcut or tauri_autostart or tauri_window_state or tauri_process -%}

# Desktop only (one table: TOML allows each header once). On iOS and Android the backend
# runs in this process and updates come from the app stores.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
{% if ipc_worker -%}
interprocess = { version = "2", optional = true }
{% endif -%}
{% if updater -%}
tauri-plugin-updater = { version = "2", optional = true }
{% endif -%}
{% if shortcut_plugin -%}
tauri-plugin-global-shortcut = "2"
{% elsif tray_menu -%}
tauri-plugin-global-shortcut = { version = "2", optional = true }
{% endif -%}
{% if tauri_plugins -%}
{% if tauri_autostart -%}
tauri-plugin-autostart = "2"
{% endif -%}
{% if tauri_window_state -%}
tauri-plugin-window-state = "2"
{% endif -%}
{% if tauri_process -%}
tauri-plugin-process = "2"
{% endif -%}
{% endif -%}
{% endif -%}
