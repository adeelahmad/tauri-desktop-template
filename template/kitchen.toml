# Kitchen project file: the answers this app was generated with. The `kitchen` CLI reads it
# to turn features on and off (`kitchen enable email`) and to upgrade from the template.
# Edit it through `kitchen`, not by hand.

[app]
# The crate and folder name (`cargo generate --name`).
name = "{{project-name}}"

[template]
# Where the template came from and at which commit (`kitchen new` fills these in).
source = ""
rev = ""

[answers]
app_name = "{{app_name}}"
identifier = "{{identifier}}"
description = "{{description}}"
github_repo = "{{github_repo}}"
frontend = "{{frontend}}"
{% if embeddings %}embedding_model = "{{embedding_model}}"
{% endif %}{% if claude_mcp %}mcp_server_name = "{{mcp_server_name}}"
mcp_package = "{{mcp_package}}"
{% endif %}embeddings = {% if embeddings %}true{% else %}false{% endif %}
postgres = {% if postgres %}true{% else %}false{% endif %}
bm25 = {% if bm25 %}true{% else %}false{% endif %}
watch_folders = {% if watch_folders %}true{% else %}false{% endif %}
ai = {% if ai %}true{% else %}false{% endif %}
