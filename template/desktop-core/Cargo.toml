[package]
name = "desktop-core"
description = "Local documents, embeddings and search for {{app_name}}"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# An app, not a library: never published to crates.io (cargo-deny treats it as private).
publish = false

[lints]
workspace = true

[features]
default = []
# TypeScript types for the Tauri commands (desktop_core::bindings, "Typed IPC" in docs/GUIDE.md).
# The app turns it on for its tests only, so release builds never contain it.
ts = ["dep:ts-rs", "dep:syn", "dep:proc-macro2", "dep:quote"]
{% if embeddings -%}
# Local ONNX embeddings through fastembed-rs (model downloads once into the cache folder).
embed = ["dep:fastembed", "dep:ort"]
{% endif -%}
{% if postgres -%}
# Embedded Postgres 16 + pgvector store (server and extension download on first use).
postgres = ["dep:postgresql_embedded", "dep:postgresql_archive", "dep:regex-lite", "dep:postgres", "dep:zip", "dep:getrandom"]
{% if bm25 -%}
# BM25 keyword ranking in Postgres (VectorChord-BM25 + pg_tokenizer), for hybrid search.
bm25 = ["postgres"]
{% endif -%}
{% endif -%}
{% if watch_folders -%}
# Watch a drop folder and other folders, and ingest what lands there.
watch = ["dep:notify", "dep:notify-debouncer-full"]
{% endif -%}
{% if ai -%}
# Chat with an LLM (cloud or local) and ask questions over the indexed documents.
ai = []
{% if local_llm -%}
# llama.cpp built in and linked statically: GGUF models run inside the app (Metal on Apple Silicon).
llama = ["ai", "dep:llama-cpp-2"]
{% endif -%}
{% endif -%}
{% if tts -%}
# Text to speech with tiny-voca through ONNX Runtime (linked statically).
tts = ["dep:ort"]
{% endif -%}
{% if stt -%}
# Speech to text with Whisper through ONNX Runtime (the same runtime, no whisper.cpp).
stt = ["dep:ort"]
{% endif -%}
{% if email -%}
# SMTP email (TLS, STARTTLS, attachments) on the rustls already in the tree.
mail = ["dep:rustls", "dep:webpki-roots"]
{% endif -%}
{% if oauth -%}
# OAuth 2 / OpenID Connect sign-in (PKCE, loopback or deep-link redirect) with tokens in the OS keychain.
oauth = ["dep:keyring"]
{% endif -%}
{% if background_jobs -%}
# A persistent background job queue with retries and schedules (croner + jiff for cron).
jobs-queue = ["dep:croner", "dep:jiff"]
{% endif -%}
{% if plugins -%}
# Static, compiled-in plugins (desktop_core::plugin): ingest hooks, search sources, methods.
plugins = []
{% endif -%}
{% if rclone -%}
# Cloud sync with a pinned, checksummed rclone downloaded on first use (zip is already in the tree).
rclone = ["dep:zip"]
{% endif -%}
{% if tailscale -%}
# Tailscale status and `tailscale serve` through the user's own tailscale CLI (no new crates).
tailscale = []
{% endif -%}
{% if http_api -%}
# A local REST API (Axum on the tokio Tauri already uses), bearer token, 127.0.0.1 by default.
http-api = ["dep:axum", "dep:tokio"]
{% endif -%}
{% if webview -%}
# Policy for embedded web views: allowlist, isolation, bridge (no new crates; sha2 is in the tree).
webview = []
{% endif -%}
{% if telemetry -%}
# Opt-in crash reports (Sentry), analytics (PostHog / Aptabase) and traces (OTLP), no SDKs.
telemetry = []
{% endif -%}
{% if mcp_server -%}
# A Model Context Protocol server over stdio (no extra dependencies).
mcp = []
{% endif -%}
{% if app_shell -%}
# Theme, mode and font settings for the app shell (validation only, no dependencies).
app-shell = []
{% endif -%}
{% if ipc_worker -%}{% if daemon -%}
# Service files, the daemon's health file and crash backoff (std only; see daemon.rs).
daemon = []
{% endif -%}{% endif -%}
{% if i18n -%}
# Translations (desktop_core::i18n): Fluent messages, plural rules, OS language; pure Rust.
i18n = ["dep:fluent-bundle", "dep:fluent-syntax", "dep:unic-langid", "dep:intl-memoizer", "dep:sys-locale", "dep:jiff"]
{% endif -%}
{% if tray_menu -%}
# The action registry for the tray, global shortcuts and the app menu (no extra crates).
tray-menu = []
{% endif -%}
{% if supply_chain -%}
# Third-party licence notices (notices.rs; the app's build script includes it too). No new crates.
supply-chain = []
{% endif -%}
{% if release_channels -%}
# Update channels, staged rollout buckets and rollback bookkeeping (sha2 and ring are in the tree).
release-channels = []
{% endif -%}
{% if evals -%}
# Search and RAG evals (desktop_core::eval): metrics, baselines, an optional LLM judge. No new crates.
evals = []
{% endif -%}
{% if pdf -%}
# PDF text through docling.rs (text layer; pages without one are OCR'd with tesseract if installed).
pdf = ["dep:docling", "dep:tempfile", "dep:libc"]
{% endif %}
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
# Already in the tree through ureq and Tauri; the facade our JSON-lines logger plugs into.
log = "0.4"
# File hashes for provenance and download checks (pure Rust).
sha2 = "0.10"
# Already in every build through rustls; seals encrypted backups (ChaCha20-Poly1305).
ring = "0.17"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Feature `ts` (tests only): TypeScript types from the Rust types (a derive, no runtime), and
# syn (already in the tree through serde and Tauri) to read the app's command list.
ts-rs = { version = "12", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }
syn = { version = "2", optional = true, features = ["full", "visit", "parsing", "printing"] }
proc-macro2 = { version = "1", optional = true }
quote = { version = "1", optional = true }
{% if background_jobs -%}
# Cron parsing and next-run times (croner), in local time with DST through jiff (pure Rust; the
# system time zone database, bundled on Windows only).
croner = { version = "5", optional = true, default-features = false, features = ["std", "jiff"] }
{% endif -%}
{% if background_jobs or i18n -%}
# Local dates and time zones (already in the tree through serde_with); jobs and i18n dates.
jiff = { version = "1.0.1", optional = true }
{% endif -%}
{% if i18n -%}
# Fluent (Mozilla's localization system, pure Rust): messages, CLDR plural rules, language
# tags. sys-locale reads the OS language (no dependencies of its own on desktop).
fluent-bundle = { version = "0.16", optional = true }
fluent-syntax = { version = "0.12", optional = true }
intl-memoizer = { version = "0.5", optional = true }
unic-langid = { version = "0.9", optional = true }
sys-locale = { version = "0.3", optional = true }
{% endif -%}
{% if email -%}
# The same rustls and Mozilla roots ureq already uses (no new crates in the build).
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = { version = "1", optional = true }
{% endif -%}
{% if oauth -%}
# The OS keychain: macOS/iOS Keychain, Windows Credential Manager, Secret Service on Linux
# (pure-Rust D-Bus and RustCrypto: no libdbus, no OpenSSL). HTTP, PKCE and JWT checks use
# the ureq, sha2 and ring already in the tree.
keyring = { version = "3.6", optional = true, default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
{% endif -%}
{% if http_api -%}
# Tokio is already in every app through Tauri; axum adds hyper and tower (HTTP/1 only, no tracing).
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "net", "time", "sync"] }
{% endif -%}
{% if embeddings -%}
fastembed = { version = "7.8", optional = true, default-features = false, features = ["onnx", "ort-download-binaries-rustls-tls", "hf-hub-rustls-tls", "onig"] }
{% endif -%}
{% if postgres or rclone -%}
# Read-only use (unpacking downloads); 9.x clears RUSTSEC-2026-0367..0369, -0429, -0545..0548.
# Pure-Rust inflate only: no zopfli compressor, no C zlib.
zip = { version = "9.8", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }
{% endif -%}
{% if postgres -%}
postgresql_embedded = { version = "0.22", optional = true, features = ["blocking"] }
# Already in the tree through postgresql_embedded: unpacks the server archive we download directly.
postgresql_archive = { version = "0.22", optional = true, default-features = false, features = ["theseus"] }
regex-lite = { version = "0.1", optional = true }
postgres = { version = "0.19", optional = true }
getrandom = { version = "0.3", optional = true }
{% endif -%}
{% if embeddings or tts or stt -%}
# The same ONNX Runtime build fastembed uses, so the two share one copy (and one environment).
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-24"] }
{% endif -%}
{% if watch_folders -%}{% unless mobile -%}
notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.5", optional = true }
{% endunless -%}{% endif -%}
{% if ai -%}{% if local_llm -%}
# No OpenMP (a shared runtime): ggml's own thread pool keeps the binary self-contained.
llama-cpp-2 = { version = "0.1.161", optional = true, default-features = false }
{% endif -%}{% endif -%}
{% if pdf -%}
docling = { version = "2.86", optional = true, default-features = false, features = ["pdf-text"] }
tempfile = { version = "3", optional = true }
{% endif %}
{% if pdf -%}
# setrlimit for the PDF parser process (libc is already in the tree through Tauri).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

{% endif -%}
{% if watch_folders -%}{% if mobile -%}
# Folder watching is desktop only: an iOS or Android app has no folders of the user's to watch.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.5", optional = true }

{% endif -%}{% endif -%}
{% if ai -%}{% if local_llm -%}
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "0.1.161", optional = true, default-features = false, features = ["metal"] }

{% endif -%}{% endif -%}
[dev-dependencies]
tempfile = "3"
